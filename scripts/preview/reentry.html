<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Re-entry sheet</title>
    <link rel="icon" href="data:," />
    <!--
      The way down into a planet's air (universe/reentry.js): a stand-in ship
      (about 0.26 long, as the map's are) diving in over a planet of radius
      17 along entry.js's path, the chase camera a little over a unit behind it, the
      show driven by entry.js's fxAt, drawn through the map's own post
      (post.js: its bloom and tone map). The sky comes up from black to a
      landing's blue as fxAt's `sky` says. Through the dev server (npx vite):
        /scripts/preview/reentry.html              the whole entry, over and over
        …?t=2.85                                   held at that moment (seconds in)
        …&small=1                                  a phone's pools
        …&reduced=1                                reduced motion
        …&cloud=%23d6e6f2&glow=%23ff8a3c           the cloud deck's and the plasma's colours
      For checking from a script: window.__reentry holds { ready, t, fx, visible: { sheath,
      streaks, clouds, white } }, window.__at(t) runs it again from the start up to t and
      window.__step(dt) carries it on dt seconds from where it is.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #e9edf2;
        font: 13px/1.3 system-ui, sans-serif;
        overflow: hidden;
      }
      #status {
        position: absolute;
        left: 12px;
        top: 10px;
        padding: 2px 6px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="status">loading…</div>
    <script type="module">
      import * as THREE from 'three';
      import { createReentry } from '/src/components/universe/reentry.js';
      import { createPost, LIGHT } from '/src/components/universe/post.js';

      const q = new URLSearchParams(location.search);
      const hold = q.has('t') ? Number(q.get('t')) : null;
      const small = q.get('small') === '1';
      const reduced = q.get('reduced') === '1';
      const cloudColour = q.get('cloud') ?? '#d6e6f2';
      const glow = q.get('glow') ?? '#ff8a3c';
      const status = document.getElementById('status');
      const V = THREE.Vector3;
      const R = 17;
      const SIZE = 0.26;
      const STEP = 1 / 60;

      // entry.js's timeline and path; the same curves made here should it not load
      const smooth = (a, b, x) => {
        const k = Math.min(1, Math.max(0, (x - a) / (b - a)));
        return k * k * (3 - 2 * k);
      };
      let fxAt = (t) => {
        const G = 4.6;
        return {
          burn: smooth(0, 0.5, t) * (1 - smooth(0.38 * G, 0.6 * G, t)),
          cloud: smooth(0.45 * G, 0.62 * G, t) * (1 - smooth(0.62 * G, 0.8 * G, t)),
          white: 0.85 * smooth(0.52 * G, 0.62 * G, t) * (1 - smooth(0.62 * G, 0.74 * G, t)),
          sky: smooth(0.1 * G, 0.7 * G, t),
        };
      };
      const nE = new V(0, 1, 0);
      const nS = new V(0, Math.cos(0.5), -Math.sin(0.5));
      let pathAt = (t) => {
        // round the great circle from nE to nS, slowing to a stop; down fast, then level
        const g = Math.min(1, t / 4.6);
        const u = 1 - (1 - g) ** 2;
        const n = new V(0, Math.cos(0.5 * u), -Math.sin(0.5 * u));
        const h = 0.5 + (3.4 - 0.5) * (1 - g) ** 3;
        return n.multiplyScalar(R + h);
      };
      let T = 5.9;
      try {
        const entry = await import('/src/components/universe/entry.js');
        fxAt = entry.fxAt;
        const path = entry.entryPath({ nE: nE.toArray(), hE: 0.2 * R, nS: nS.toArray(), hH: 0.5, rest: 0.08, R });
        pathAt = (t) => new V(...path.at(t).p);
        T = path.T;
      } catch (e) {
        console.warn('entry.js did not load: its curves made here', e);
      }

      const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(1.5, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.prepend(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0, 0, 0);
      const camera = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.004, 400);
      const post = createPost(renderer, scene, camera, { small });

      const sun = new THREE.DirectionalLight('#fff4e0', 2.6);
      sun.position.copy(LIGHT).multiplyScalar(50);
      scene.add(sun, new THREE.HemisphereLight('#bcd2ff', '#2a2f22', 0.7));

      // the planet: its middle at the origin, as footScene's root is
      const root = new THREE.Group();
      scene.add(root);
      const planet = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 64), new THREE.MeshStandardMaterial({ color: '#5f7d4a', roughness: 0.95 }));
      root.add(planet);

      // a stand-in ship, its nose down +z, about 0.26 long
      const ship = new THREE.Group();
      const hull = new THREE.MeshStandardMaterial({ color: '#c9ced6', metalness: 0.4, roughness: 0.45 });
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.1, 16).rotateX(Math.PI / 2), hull);
      nose.position.z = 0.08;
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.16), hull);
      body.position.z = -0.05;
      const wings = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.008, 0.06), hull);
      wings.position.z = -0.08;
      ship.add(nose, body, wings);
      root.add(ship);

      const fx = createReentry({ small, reduced });
      root.add(fx.group);

      const sky = new THREE.Color('#5f95d8');
      const black = new THREE.Color(0, 0, 0);
      const m = new THREE.Matrix4();
      const state = { ship: new V(), dir: new V(0, 0, -1), up: new V(0, 1, 0), size: SIZE, cam: { pos: new V(), look: new V(), up: new V() }, fx: null, t: 0 };
      const side = new V();
      const lift = new V();
      const ahead = new V();

      // the ship and the chase camera, t seconds in (where footScene's view()
      // puts it while flying in, with the lens it has on foot)
      const pose = (t) => {
        state.ship.copy(pathAt(t));
        ahead.copy(pathAt(t + 0.02)).sub(state.ship);
        if (ahead.lengthSq() < 1e-10) ahead.copy(state.dir);
        state.dir.copy(ahead).normalize();
        state.up.copy(state.ship).normalize();
        side.crossVectors(state.dir, state.up).normalize();
        lift.crossVectors(side, state.dir);
        ship.position.copy(state.ship);
        ship.quaternion.setFromRotationMatrix(m.makeBasis(side.clone().negate(), lift, state.dir));
        const c = state.cam;
        c.pos.copy(state.ship).addScaledVector(state.dir, -1.15).addScaledVector(state.up, 0.32);
        c.look.copy(state.ship).addScaledVector(state.dir, 0.6);
        c.up.copy(state.up);
        camera.position.copy(c.pos);
        camera.up.copy(c.up);
        camera.lookAt(c.look);
      };

      let t = 0;
      const step = (dt) => {
        t += dt;
        pose(t);
        state.t = t;
        state.fx = fxAt(t);
        fx.update(dt, state);
        scene.background.copy(black).lerp(sky, state.fx.sky ?? 0);
      };
      const run = (to) => {
        t = 0;
        fx.stop();
        fx.start({ cloud: cloudColour, glow });
        while (t + STEP <= to + 1e-9) step(STEP);
      };

      const draw = () => {
        post.render(innerWidth, innerHeight);
        const f = state.fx ?? { burn: 0, cloud: 0, white: 0 };
        const [sheath, streaks, clouds, white] = fx.group.children;
        window.__reentry = { ready: true, t: +t.toFixed(3), fx: f, visible: { group: fx.group.visible, sheath: sheath.visible, streaks: streaks.visible, clouds: clouds.visible, white: white.visible } };
        status.textContent = `t ${t.toFixed(2)} s · burn ${f.burn.toFixed(2)} · cloud ${f.cloud.toFixed(2)} · white ${f.white.toFixed(2)}${small ? ' · small' : ''}${reduced ? ' · reduced' : ''}`;
      };

      window.__at = (to) => {
        run(to);
        draw();
        return window.__reentry;
      };
      window.__step = (dt = STEP) => {
        for (let k = 0; k < Math.round(dt / STEP); k++) step(STEP);
        draw();
        return window.__reentry;
      };
      addEventListener('resize', () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        draw();
      });
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();

      if (hold !== null) {
        run(hold);
        draw();
      } else {
        run(0);
        let last = performance.now();
        const loop = (now) => {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          step(dt);
          if (t > T + 0.8) run(0);
          draw();
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
