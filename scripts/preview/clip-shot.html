<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clip shot</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1a2029;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- A figure's clips, a row each, four moments across, for
         scripts/clip-shot.mjs (through the dev server):
         ?url=/models/…glb&clips=idle,walk&w=240&h=320 (no clips: all of them) -->
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';

      const q = new URLSearchParams(location.search);
      const W = Number(q.get('w') ?? 240);
      const H = Number(q.get('h') ?? 320);
      const STEPS = [0, 0.25, 0.5, 0.75];
      const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(q.get('url'));
      const names = q.get('clips') ? q.get('clips').split(',') : gltf.animations.map((c) => c.name);
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W * STEPS.length, H * names.length);
      renderer.setScissorTest(true);
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#1a2029');
      const sun = new THREE.DirectionalLight('#fff4e6', 2.4);
      sun.position.set(2, 4, 3);
      scene.add(sun, new THREE.HemisphereLight('#ccd8e6', '#3a3028', 1.2));
      const root = gltf.scene;
      scene.add(root);
      // the floor under it, so a clip that leaves the ground shows it
      const floor = new THREE.Mesh(new THREE.CircleGeometry(1.2, 32), new THREE.MeshBasicMaterial({ color: '#2c3644' }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);
      const box = new THREE.Box3().setFromObject(root);
      const h = box.max.y - box.min.y;
      root.position.y -= box.min.y;
      const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
      const mixer = new THREE.AnimationMixer(root);
      const info = [];
      names.forEach((name, row) => {
        const clip = gltf.animations.find((c) => c.name === name);
        if (!clip) return;
        mixer.stopAllAction();
        const a = mixer.clipAction(clip);
        a.play();
        // (and where its head is from its hips, halfway through: which way it lies)
        mixer.setTime(clip.duration * 0.5);
        root.updateMatrixWorld(true);
        const bone = (re) => { let b = null; root.traverse((o) => { if (!b && o.isBone && re.test(o.name)) b = o; }); return b; };
        const head = bone(/head/i)?.getWorldPosition(new THREE.Vector3());
        const hips = bone(/hips/i)?.getWorldPosition(new THREE.Vector3());
        const d = head && hips ? head.sub(hips).normalize() : null;
        info.push(`${name} ${clip.duration.toFixed(1)}s${d ? ` head ${d.toArray().map((v) => v.toFixed(2)).join(',')}` : ''}`);
        STEPS.forEach((f, col) => {
          mixer.setTime(clip.duration * f);
          // three-quarters from the front, the whole figure in frame
          const d = h * 2.4;
          cam.position.set(d * 0.55, h * 0.7, d * 0.85);
          cam.lookAt(0, h * 0.5, 0);
          const y = (names.length - 1 - row) * H;
          renderer.setViewport(col * W, y, W, H);
          renderer.setScissor(col * W, y, W, H);
          renderer.render(scene, cam);
        });
      });
      document.title = JSON.stringify(info);
      window.__done = true;
    </script>
  </body>
</html>
