<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heroes sheet</title>
    <!--
      The galaxy's heroes (galaxy/heroes.js), each loaded as a world loads
      them (heroSpec, loadPartyFigure) and holding what they carry the way
      surface/scene.js has them hold it: a gun through universe/gunplay.js,
      a lightsaber through surface/saber.js over it. In a row on a metre
      grid, the clips held at one phase. Through the dev server (npx vite):
        /scripts/preview/heroes.html                     the saber lit at guard, the guns carried
        …?mode=carry | guard | aim | swing | heavy | block | charge
        …&dir=up&k=0.5                                   which stroke (a way: up, left, right, rise; else the combo's first) and how far through (swing, heavy)
        …&view=three | front | side | back | left | top  from where
        …&only=luke,han                                  some of them
        …&move=0.5                                       walking (0…1)
        …&phase=0.3                                      where in its clips each figure is (0…1)
        …&zoom=2                                         closer
      window.__pose({ mode, dir, k, move, phase }) and window.__view(name, zoom) for a script;
      body[data-metrics] holds, per hero, the hand, the blade's direction and the arms.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #20242c;
        color: #e9edf2;
        font: 13px/1.3 system-ui, sans-serif;
        overflow: hidden;
      }
      #labels div {
        position: absolute;
        transform: translate(-50%, 0);
        padding: 2px 6px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        white-space: nowrap;
        pointer-events: none;
      }
      #status {
        position: absolute;
        left: 12px;
        top: 10px;
      }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <div id="status">loading…</div>
    <script type="module">
      import * as THREE from 'three';
      import { loadPartyFigure } from '/src/components/universe/footScene.js';
      import { METRE } from '/src/components/universe/foot.js';
      import { createGunplay } from '/src/components/universe/gunplay.js';
      import { createSaber } from '/src/components/galaxy/surface/saber.js';
      import { preload, loadClip } from '/src/lib/three/clipLibrary.js';
      import { HEROES, heroSpec, readHero } from '/src/components/galaxy/heroes.js';
      import { BLOCK_CLIP, DIRS, HEAVY, STANCES, strokeFor } from '/src/components/galaxy/surface/combatRules.js';

      const q = new URLSearchParams(location.search);
      const num = (k, d) => Number(q.get(k) ?? d);
      const only = (q.get('only') ?? 'luke,han,bobafett,leia,ahsoka,chewie').split(',');
      const status = document.getElementById('status');
      const V = THREE.Vector3;
      const deg = (r) => +((r * 180) / Math.PI).toFixed(1);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(2, devicePixelRatio));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.prepend(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#20242c');
      const lights = [new THREE.HemisphereLight('#dfe8ff', '#4a3f33', 1.4), new THREE.DirectionalLight('#fff4e0', 2.6)];
      lights[1].position.set(-4, 8, 6);
      scene.add(...lights);

      const who = HEROES.filter((h) => only.includes(h.id));
      const placed = [];
      let x = 0;
      for (const h of who) {
        const spec = heroSpec(readHero({ id: h.id }));
        const holder = new THREE.Group();
        let fig = null;
        try {
          fig = await loadPartyFigure(spec, null);
          const inner = new THREE.Group();
          inner.scale.setScalar(1 / METRE);
          inner.add(fig.model);
          holder.add(inner);
        } catch (e) {
          console.error(h.id, e);
        }
        scene.add(holder);
        holder.position.x = x;
        holder.updateMatrixWorld(true);
        const gp = fig ? createGunplay(fig, fig.gun ?? spec.gun, { unit: 1, who: fig.built ? 'built' : spec.id }) : null;
        const saber = gp && spec.saber ? createSaber(gp, { color: spec.saber.color, hilt: spec.saber.hilt, stance: spec.saber.stance, parent: scene, fig }) : null;
        placed.push({ id: h.id, spec, fig, gp, saber, holder, at: x });
        x += 1.6;
      }
      // (the strokes' clips in before the first pose)
      await preload([...new Set([...Object.values(STANCES).flatMap((s) => s.strokes.map((k) => k.clip)), ...HEAVY.clips, ...Object.values(DIRS).map((d) => d.clip), BLOCK_CLIP])]);
      await new Promise((r) => setTimeout(r, 50));
      const span = Math.max(0, x - 1.6);
      const grid = new THREE.GridHelper(Math.ceil(span + 20), Math.ceil(span + 20), '#5a6270', '#363c46');
      grid.position.x = span / 2;
      scene.add(grid);
      const up = new V(0, 1, 0);
      const forward = new V(0, 0, 1);

      const holdPhase = (p, phase) => {
        for (const a of Object.values(p.fig?.act ?? {})) if (a) a.time = phase * a.getClip().duration;
      };
      let metrics = [];
      let clock = 0; // (one clock across poses, moved on between them so a stroke left going ends)
      // as scene.js runs them each frame: the clip, gunplay's pose (a lit saber
      // held at 0.75 of the way up at least), the saber's over it
      const pose = async (o = {}) => {
        const mode = o.mode ?? 'guard';
        const move = o.move ?? 0;
        const phase = o.phase ?? 0.25;
        const frames = 40;
        const dt = 1 / 30;
        for (const p of placed) holdPhase(p, phase);
        clock += 10;
        let t = clock;
        // a stroke: started so it's `k` through on the last frame
        const stroke = mode === 'swing' || mode === 'heavy';
        const end = t + frames * dt;
        const swung = new Set();
        for (const p of placed) {
          const s = p.saber;
          if (!s) continue;
          s.light(mode !== 'carry');
          s.block(false);
          s.setCharge(0);
        }
        for (let f = 0; f < frames; f++) {
          t += dt;
          clock = t;
          for (const p of placed) {
            if (!p.fig) continue;
            const s = p.saber;
            if (s && stroke && !swung.has(p)) {
              const k = strokeFor(s.stance, { heavy: mode === 'heavy', dir: o.dir ?? null });
              const clip = await loadClip(k.clip);
              const dur = (clip?.duration ?? 0.6) / k.speed;
              const t0 = end - (o.k ?? 0.5) * dur;
              if (t >= t0) {
                s.swing(t0, { heavy: mode === 'heavy', dir: o.dir ?? null });
                swung.add(p);
              }
            }
            p.fig.update(dt, move);
            if (p.fig.act) holdPhase(p, phase);
            p.fig.mixer?.update(0);
            s?.stand(dt, t, move);
            p.holder.updateMatrixWorld(true);
            p.fig.after?.(dt, { speed: 0, side: 0, turn: 0, air: 0, hurt: 0, knock: 0.5 }, { forward, up });
            if (s) {
              if (mode === 'block') s.block(true);
              if (mode === 'charge') s.setCharge(Math.min(1, f / 10));
            }
            const lit = s?.lit;
            const aimK = mode === 'aim' ? 1 : lit ? 0.75 : 0;
            p.gp?.set(dt, { aim: aimK, look: mode === 'aim' ? 1 : 0, dir: null, forward, up });
            s?.update(dt, t, { forward, up, me: null, targets: [] });
          }
        }
        const P = (b) => b.getWorldPosition(new V());
        metrics = placed.map((p) => {
          if (!p.gp) return { id: p.id, armed: false };
          const b = p.gp.bones;
          const S = P(b.RightArm);
          const E = P(b.RightForeArm);
          const H = P(b.RightHand);
          const Y = new V(0, 1, 0).transformDirection(p.gp.gun.matrixWorld).normalize();
          const Z = new V(0, 0, 1).transformDirection(p.gp.gun.matrixWorld).normalize();
          const L = b.LeftHand ? P(b.LeftHand) : null;
          const grip = (p.gp.gun.getObjectByName('grip') ?? p.gp.gun).getWorldPosition(new V());
          return {
            id: p.id,
            gun: p.spec.gun,
            hand: H.toArray().map((v) => +v.toFixed(2)),
            handFromChest: H.clone().sub(p.holder.position).toArray().map((v) => +v.toFixed(2)),
            blade: (p.saber ? Y : Z).toArray().map((v) => +v.toFixed(2)),
            elbow: deg(Math.PI - E.clone().sub(S).angleTo(H.clone().sub(E))),
            leftToGripCm: L ? +(L.distanceTo(grip) * 100).toFixed(0) : null,
            leftMissCm: p.gp.debug(forward, up).leftMiss == null ? null : +(p.gp.debug(forward, up).leftMiss * 100).toFixed(1),
          };
        });
        document.body.dataset.metrics = JSON.stringify(metrics);
        return metrics;
      };

      const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.05, 500);
      const labels = document.getElementById('labels');
      const VIEWS = { three: [0.6, 0.22, 1], front: [0, 0.1, 1], side: [1, 0.1, 0], back: [0, 0.12, -1], top: [0.05, 1, 0.3], left: [-1, 0.1, 0], low: [0.4, -0.15, 1] };
      const view = (name = 'three', zoom = 1, focus = null) => {
        const p = focus ? placed.find((x) => x.id === focus) : null;
        const mid = new V(p ? p.at : span / 2, 1.05, 0);
        const far = (p ? 3.2 : Math.max(span * 1.45, 5)) / zoom;
        camera.position.copy(mid).add(new V(...(VIEWS[name] ?? VIEWS.three)).normalize().multiplyScalar(far));
        camera.lookAt(mid);
        renderer.render(scene, camera);
        labels.innerHTML = '';
        for (const pl of placed) {
          const box = new THREE.Box3().setFromObject(pl.holder);
          const s = new V(pl.at, box.max.y + 0.12, 0).project(camera);
          if (s.z > 1) continue;
          const d = document.createElement('div');
          d.style.left = `${((s.x + 1) / 2) * innerWidth}px`;
          d.style.top = `${((1 - s.y) / 2) * innerHeight - 22}px`;
          d.textContent = `${pl.id} · ${pl.spec.gun}`;
          labels.append(d);
        }
        status.textContent = `${name}`;
      };
      // a tile each: a row per hero, a column per view, close on them
      let tiling = null;
      const tiles = (ids = placed.map((p) => p.id), views = ['front', 'three', 'side'], zoom = 1.4) => {
        tiling = { ids, views, zoom };
        const W = innerWidth;
        const H = innerHeight;
        const rows = ids.length;
        const cols = views.length;
        const tw = Math.floor(W / cols);
        const th = Math.floor(H / rows);
        const cam = new THREE.PerspectiveCamera(30, tw / th, 0.05, 50);
        renderer.setScissorTest(true);
        renderer.setClearColor('#20242c');
        renderer.clear();
        labels.innerHTML = '';
        ids.forEach((id, r) => {
          const p = placed.find((x) => x.id === id);
          if (!p) return;
          const mid = zoom >= 2.5 && p.gp ? p.gp.bones.RightHand.getWorldPosition(new V()) : new V(p.at, (p.spec.tall ?? 1.8) * 0.55, 0); // (close: on the gun hand)
          for (const o of placed) o.holder.visible = o === p; // (the others out of the way)
          views.forEach((v, c) => {
            cam.position.copy(mid).add(new V(...(VIEWS[v] ?? VIEWS.three)).normalize().multiplyScalar((3.4 * (p.spec.tall ?? 1.8)) / 1.8 / zoom));
            cam.lookAt(mid);
            renderer.setViewport(c * tw, H - (r + 1) * th, tw, th);
            renderer.setScissor(c * tw, H - (r + 1) * th, tw, th);
            renderer.render(scene, cam);
          });
          const d = document.createElement('div');
          d.style.left = `${40}px`;
          d.style.top = `${r * th + 4}px`;
          d.textContent = id;
          labels.append(d);
        });
        for (const o of placed) o.holder.visible = true;
        renderer.setScissorTest(false);
        renderer.setViewport(0, 0, W, H);
        status.textContent = '';
      };
      window.__tiles = (...a) => {
        tiles(...a);
        frames = 0;
        requestAnimationFrame(redraw);
      };
      // (redrawn a while, for the textures that come in late)
      let frames = 0;
      const redraw = () => {
        if (tiling) tiles(tiling.ids, tiling.views, tiling.zoom);
        else renderer.render(scene, camera);
        if (++frames < 120) requestAnimationFrame(redraw);
      };
      requestAnimationFrame(redraw);
      window.__pose = pose;
      window.__view = (...a) => {
        tiling = null;
        view(...a);
        frames = 0;
        requestAnimationFrame(redraw);
      };
      window.__sheet = { THREE, placed, scene };

      await pose({ mode: q.get('mode') ?? 'guard', dir: q.get('dir'), k: num('k', 0.5), move: num('move', 0), phase: num('phase', 0.25) });
      if (q.get('tiles')) window.__tiles(q.get('tiles').split(','), (q.get('views') ?? 'front,three,side').split(','), num('zoom', 1.4));
      else view(q.get('view') ?? 'three', num('zoom', 1), q.get('focus'));
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
