<!doctype html><html><body style="margin:0;background:#0b0e14"><canvas id="c" width="1600" height="900"></canvas>
<script type="module">
import * as THREE from 'three';
import { buildTraffic } from '/src/components/universe/trafficModels.js';
const KINDS = ['suv', 'suvace', 'lowrider', 'pollostruck', 'madrigal', 'pestvan', 'saulcaddy', 'mikesedan', 'cousins', 'pickup'];
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#cfe3ff', '#4a3b2a', 1.6));
const sun = new THREE.DirectionalLight('#fff2d8', 2.4); sun.position.set(3, 5, 4); scene.add(sun);
const cam = new THREE.PerspectiveCamera(32, 1600 / 900, 0.01, 100);
cam.position.set(0, 2.6, 7.2); cam.lookAt(0, 0, 0);
const out = [];
KINDS.forEach((k, i) => {
  try {
    const m = buildTraffic(k);
    const col = i % 5, row = Math.floor(i / 5);
    m.group.position.set((col - 2) * 1.5, 0.6 - row * 1.3, 0);
    m.group.rotation.y = -0.7; m.group.rotation.x = 0.25;
    m.group.scale.setScalar(1.2);
    scene.add(m.group);
    m.update(1.3);
    let tris = 0; m.group.traverse((o) => { if (o.isMesh) tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; });
    out.push({ k, ok: true, tris, size: m.size.toArray().map((v) => +v.toFixed(2)) });
  } catch (e) { out.push({ k, ok: false, err: String(e) }); }
});
renderer.render(scene, cam);
window.__cars = out;
</script></body></html>
