<!doctype html>
<!--
  The giant N64's insides: a Nintendo 64 emulated in the browser by
  EmulatorJS (https://emulatorjs.org, GPL-3.0) with its mupen64plus core,
  both from EmulatorJS's own CDN. It plays the ROM the page around it posts
  here ({ type: 'n64-rom', bytes, name }): a file the player gave it from
  their own device. Nothing here fetches a game. It tells the page above
  when it's ready for one ('ready'), when the game is running ('running')
  and if it can't start ('failed').
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N64</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      (function () {
        var DATA = 'https://cdn.emulatorjs.org/4.2.3/data/';
        var tell = function (state, detail) {
          parent.postMessage({ type: 'n64', state: state, detail: detail || null }, location.origin);
        };
        var started = false;
        var start = function (bytes, name) {
          if (started) return;
          started = true;
          // (a File, so the emulator knows its name and type)
          var file = new File([bytes], (name || 'game').replace(/[^\w.-]+/g, '_'), { type: 'application/octet-stream' });
          window.EJS_player = '#game';
          window.EJS_core = 'n64';
          window.EJS_gameUrl = file;
          window.EJS_gameName = name || 'N64';
          window.EJS_pathtodata = DATA;
          window.EJS_startOnLoaded = true;
          window.EJS_color = '#e52521';
          window.EJS_backgroundColor = '#000000';
          window.EJS_volume = 0.6;
          // Keys laid out for Super Mario 64 (the core reads RetroPad B as
          // the N64's A, Y as B, L2 as Z, the left stick as the Control
          // Stick and the right as the C buttons): WASD the stick, Space A,
          // J B, Shift Z, Enter Start, the arrows the C buttons (the
          // camera), Q and E the L and R triggers. A controller is mapped as
          // the emulator maps it; its Controls menu changes any of it.
          window.EJS_defaultControls = {
            0: {
              0: { value: 'space', value2: 'BUTTON_2' },
              1: { value: 'j', value2: 'BUTTON_4' },
              2: { value: '', value2: 'SELECT' },
              3: { value: 'enter', value2: 'START' },
              4: { value: '', value2: 'DPAD_UP' },
              5: { value: '', value2: 'DPAD_DOWN' },
              6: { value: '', value2: 'DPAD_LEFT' },
              7: { value: '', value2: 'DPAD_RIGHT' },
              8: { value: 'k', value2: 'BUTTON_1' },
              9: { value: 'i', value2: 'BUTTON_3' },
              10: { value: 'q', value2: 'LEFT_TOP_SHOULDER' },
              11: { value: 'e', value2: 'RIGHT_TOP_SHOULDER' },
              12: { value: 'shift', value2: 'LEFT_BOTTOM_SHOULDER' },
              13: { value: 'r', value2: 'RIGHT_BOTTOM_SHOULDER' },
              14: { value: '', value2: 'LEFT_STICK' },
              15: { value: '', value2: 'RIGHT_STICK' },
              16: { value: 'd', value2: 'LEFT_STICK_X:+1' },
              17: { value: 'a', value2: 'LEFT_STICK_X:-1' },
              18: { value: 's', value2: 'LEFT_STICK_Y:+1' },
              19: { value: 'w', value2: 'LEFT_STICK_Y:-1' },
              20: { value: 'right arrow', value2: 'RIGHT_STICK_X:+1' },
              21: { value: 'left arrow', value2: 'RIGHT_STICK_X:-1' },
              22: { value: 'down arrow', value2: 'RIGHT_STICK_Y:+1' },
              23: { value: 'up arrow', value2: 'RIGHT_STICK_Y:-1' },
            },
            1: {},
            2: {},
            3: {},
          };
          window.EJS_onGameStart = function () {
            tell('running');
          };
          var s = document.createElement('script');
          s.src = DATA + 'loader.js';
          s.onerror = function () {
            tell('failed', 'The emulator could not be downloaded.');
          };
          document.body.appendChild(s);
        };
        window.addEventListener('message', function (e) {
          if (e.origin !== location.origin || !e.data || e.data.type !== 'n64-rom') return;
          start(e.data.bytes, e.data.name);
        });
        tell('ready');
      })();
    </script>
  </body>
</html>
